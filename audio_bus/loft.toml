[package]
name    = "audio_bus"
version = "0.2.0"
loft    = ">=2026.10.0"
repository = "loft-libs-game"
description = "A mixer for game audio — buses that multiply, and a duck that restores exactly"
categories  = ["game", "audio"]

# 0.2.0 plays through the `audio` library instead of `graphics`: a clip comes from
# `audio::load`, so a caller's clips change and this release is no drop-in for 0.1.
api_compatible_with  = "0.2.0"   # oldest own release this is a drop-in for
data_compatible_with = "0.1.0"   # oldest own release whose stored data this reads

[library]
entry = "src/audio_bus.loft"

[dependencies]
audio = ">=0.2.0"
