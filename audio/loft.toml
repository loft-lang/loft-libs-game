[package]
name    = "audio"
version = "0.2.3"
loft    = ">=2026.10.0"
repository = "loft-libs-game"
description = "Clips, voices and one mix: the same sound on a PC and on a 32-bit device"
categories  = ["game", "audio"]

# 0.2.0 adds the output layer (`start`); every 0.1 call is unchanged.
api_compatible_with  = "0.1.0"   # oldest own release this is a drop-in for
data_compatible_with = "0.1.0"   # oldest own release whose stored data this reads

[library]
entry = "src/audio.loft"

# The engine is C99 the package ships and loft builds itself with `cc` (and `clang` for the two
# wasm targets): `c/audio_engine.c`, with OGG Vorbis by the vendored stb_vorbis
# (`c/vendor/stb_vorbis`, public domain / MIT) on every target but wasm.  Bound by the `#c`
# declarations in src/audio.loft.  No Rust crate, no rustc, no wasm bridge.
[c]
shim = "c/audio_engine.c"

# What this package ships, compiles in or opens that it did not write (loft THIRDPARTY.md).
[thirdparty.miniaudio]
kind       = "vendored"
path       = "c/vendor/miniaudio"
upstream   = "https://github.com/mackron/miniaudio"
commit     = "877ea4a7c2601c7b0f2a44e83dfac42e6470fea6"
version    = "0.11.26"
digest     = "sha256:effa2867cf3c10ca28ad3c2beebbef5d1546ba073c14ca95dff01e8cc9e9664a"
advisories = ["nvd:miniaudio", "osv:commit", "github:mackron/miniaudio"]

[thirdparty.miniaudio.reviewed]
CVE-2021-34184 = "not-reached: the VFS (ma_default_vfs_close__stdio) is compiled in but nothing calls it — its public entry points have no caller in the build and audio_out.c uses only the device and mutex API; our 0.11.21 close is a single fclose"
CVE-2021-34185 = "not-reached: dr_wav is compiled out (MA_NO_DECODING, MA_NO_ENCODING); drwav_bytes_to_u32 is absent from the preprocessed build"
CVE-2024-41147 = "not-reached: dr_flac is compiled out (MA_NO_DECODING); ma_dr_flac__decode_samples__lpc is absent from the preprocessed build"
CVE-2026-32837 = "not-reached: the WAV BEXT parser is dr_wav, compiled out (MA_NO_DECODING); no bext or codingHistory code in the preprocessed build"

[thirdparty.stb_vorbis]
kind            = "vendored"
path            = "c/vendor/stb_vorbis"
upstream        = "https://github.com/nothings/stb"
commit          = "6d17754ecc01e3772fd70ef4de7541277c4bf095"
upstream-reviewed = "9600522de53973336fa033a289858a4354cbb04c"
version         = "1.23"
modified        = ["stb_vorbis.c"]
digest          = "sha256:db7e4538102ab7b175f43a44f07c96c44e392ddf4843ba84759a63828ef70f81"
advisories      = ["nvd:stb_vorbis"]
# Back on the original: nothings/stb resumed fixes and shipped v1.23 (a burst of overflow, OOB,
# UB and decode fixes to stb_vorbis.c since 2026-10-26) plus the 64-bit rework.  The sezero fork
# we carried through 0.2.1 went dormant (last stb_vorbis.c commit 2026-07-13) and now LAGS that
# batch.  The original carries every fix the fork had except CVE-2023-45682, which we keep as a
# one-line local change (listed in `modified`): the DECODE sparse guard of upstream PR
# nothings/stb#1560, submitted upstream, to be dropped once a tagged release carries it.

[thirdparty.stb_vorbis.reviewed]
CVE-2018-1000050 = "fixed: in v1.13; our copy is v1.23"
CVE-2019-13217 = "fixed: in v1.17 (its changelog names CVE-2019-13217..13223); our copy is v1.23"
CVE-2019-13218 = "fixed: in v1.17 (its changelog names CVE-2019-13217..13223); our copy is v1.23"
CVE-2019-13219 = "fixed: in v1.17 (its changelog names CVE-2019-13217..13223); our copy is v1.23"
CVE-2019-13220 = "fixed: in v1.17 (its changelog names CVE-2019-13217..13223); our copy is v1.23"
CVE-2019-13221 = "fixed: in v1.17 (its changelog names CVE-2019-13217..13223); our copy is v1.23"
CVE-2019-13222 = "fixed: in v1.17 (its changelog names CVE-2019-13217..13223); our copy is v1.23"
CVE-2019-13223 = "fixed: in v1.17 (its changelog names CVE-2019-13217..13223); our copy is v1.23"
CVE-2023-45675 = "fixed: in v1.23 (setup_malloc/setup_temp_malloc overflow guards, f5d198c); the published GHSL PoC is refused cleanly under ASan+UBSan — measured on our shipped file"
CVE-2023-45676 = "fixed: in v1.23 (setup_malloc overflow guards + comment_list memset/NULL guard, f5d198c); the published GHSL PoC is refused cleanly under ASan+UBSan — measured on our shipped file"
CVE-2023-45677 = "fixed: in v1.23 (setup_malloc overflow guards, f5d198c); the published GHSL PoC is refused cleanly under ASan+UBSan — measured on our shipped file"
CVE-2023-45678 = "fixed: in v1.23 (Mapping submap_floor/submap_residue sized 16); the published GHSL PoC is refused cleanly under ASan+UBSan — measured on our shipped file"
CVE-2023-45679 = "fixed: in v1.23 (comment_list memset so vorbis_deinit frees only initialised entries); the published GHSL PoC is refused cleanly under ASan+UBSan — measured on our shipped file"
CVE-2023-45680 = "fixed: in v1.23 (comment_list NULL guard in vorbis_deinit); the published GHSL PoC is refused cleanly under ASan+UBSan — measured on our shipped file"
CVE-2023-45681 = "fixed: in v1.23 (comment_list_length overflow guard, f5d198c); the published GHSL PoC is refused cleanly under ASan+UBSan — measured on our shipped file"
CVE-2023-45682 = "fixed: by the one-line DECODE sparse guard we carry (modified; upstream PR nothings/stb#1560 / GHSL-2023-172).  A crafted minimal stream reaching the unguarded sorted_values[-1] read crashes pristine v1.23 and is clean on our file under ASan+UBSan — measured"
CVE-2026-5316 = "fixed: measured — our shipped file rejects its PoC cleanly under ASan, where v1.22 crashed"
CVE-2026-5317 = "fixed: measured — our shipped file rejects its PoC cleanly under ASan, where v1.22 crashed"
CVE-2026-89266 = "fixed: in v1.23 (codebook/multiplicands size path hardened: CODEBOOK_LIMIT a5ccde4, lookup1_values on doubles b9c73af); its PoC is refused cleanly under ASan — measured on our shipped file"

[thirdparty.audio-backends]
kind     = "system"
names    = ["asound", "pulse", "jack", "jack64", "sndio", "aaudio", "OpenSLES",
            "CoreAudio", "AudioToolbox", "AudioUnit", "CoreFoundation",
            "dsound", "winmm", "mmdevapi", "avrt", "ole32", "kernel32", "advapi32", "user32"]
provider = "the OS sound stack (ALSA, PulseAudio, JACK, sndio, AAudio/OpenSL ES, CoreAudio, WASAPI/DirectSound/WinMM), each opened by miniaudio at run time when present"
