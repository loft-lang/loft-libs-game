[thirdparty.audio-backends]
kind     = "system"
names    = ["asound", "pulse", "jack", "jack64", "sndio", "aaudio", "OpenSLES",
            "CoreAudio", "AudioToolbox", "AudioUnit", "CoreFoundation",
            "dsound", "winmm", "mmdevapi", "avrt", "ole32", "kernel32", "advapi32", "user32"]
provider = "the OS sound stack (ALSA, PulseAudio, JACK, sndio, AAudio/OpenSL ES, CoreAudio, WASAPI/DirectSound/WinMM), each opened by miniaudio at run time when present"
