[package]
name    = "input"
version = "0.3.0"
loft    = ">=2026.10.0"
api_compatible_with  = "0.3.0"   # oldest own release this is a drop-in for
data_compatible_with = "0.1.0"   # oldest own release whose stored data this reads
repository = "loft-libs-game"
description = "Game input for loft — action/axis bindings resolved to per-tick input state."

[library]
entry = "src/input.loft"

# The machine's own key source (`device_open`, `input_tick_device`): C99 loft builds with `cc`
# (`clang` for wasm) — the Tanmatsu's BSP keys under ESP-IDF, a raw terminal elsewhere.
[c]
shim = "c/keys.c"

[dependencies]
graphics = ">=0.10.0"
