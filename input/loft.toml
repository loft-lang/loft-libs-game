[package]
name    = "input"
version = "0.3.1"
loft    = ">=2026.10.0"
api_compatible_with  = "0.3.1"   # DECLARED BREAK: graphics' `Canvas` and `Glyph` reshape through
data_compatible_with = "0.3.1"   # the dependency (its 0.12 break: `u32` pixels), which 0.3.0's
                                 # floor held off; this package's own surface is a superset.
repository = "loft-libs-game"
description = "Game input for loft — action/axis bindings resolved to per-tick input state."

[library]
entry = "src/input.loft"

# The machine's own key source (`device_open`, `input_tick_device`): C99 loft builds with `cc`
# (`clang` for wasm) — the Tanmatsu's BSP keys under ESP-IDF, a raw terminal elsewhere.
[c]
shim = "c/keys.c"

[dependencies]
graphics = ">=0.13.3"
